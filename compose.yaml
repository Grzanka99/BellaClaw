services:
  bellaclaw:
    image: bellaclaw:local
    build:
      context: .
      dockerfile: Containerfile
    container_name: bellaclaw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BELLACLAW_AI_CREDENTIALS_PATH=/app/.secrets/pi-auth.json
      - BELLACLAW_LOG_DB_ROOT=/app-data
      - BELLACLAW_EMBEDDING_BASE_URL=http://ollama:11434
      - BELLACLAW_LOGS_MCP_URL=http://log-viewer:8989/mcp
      - SIGNAL_CLI_RPC_URL=http://signal-cli:8080
    depends_on:
      - ollama
      - log-viewer
    command: ["bun", "run", "--cwd", "apps/assistant", "start"]
    volumes:
      - bellaclaw-data:/app-data
      - ./.secrets:/app/.secrets
    ports:
      - "127.0.0.1:3080:3080"

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: bellaclaw-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  log-viewer:
    image: bellaclaw:local
    pull_policy: never
    container_name: bellaclaw-log-viewer
    restart: unless-stopped
    environment:
      - BELLACLAW_LOG_DB_PATH=${BELLACLAW_LOG_DB_PATH:-/app-data/bellaclaw-logs.db}
      - BELLACLAW_LOG_DB_ROOT=/app-data
      - BELLACLAW_LOG_VIEWER_HOSTNAME=0.0.0.0
      - LOG_CHATID_HMAC_KEY=${LOG_CHATID_HMAC_KEY:-}
    command: ["bun", "run", "--cwd", "apps/log-viewer", "start"]
    ports:
      - "0.0.0.0:8989:8989"
    volumes:
      - bellaclaw-data:/app-data:ro

  dashboard:
    image: bellaclaw:local
    pull_policy: never
    container_name: bellaclaw-dashboard
    restart: on-failure
    env_file:
      - .env
    environment:
      - BELLACLAW_INTERNAL_API_URL=http://bellaclaw:3081
      - BELLACLAW_DASHBOARD_DB_PATH=/dashboard-data/dashboard.db
    depends_on:
      - bellaclaw
    command: ["bun", "run", "--cwd", "apps/dashboard", "start"]
    ports:
      - "127.0.0.1:8988:8988"
    volumes:
      - dashboard-data:/dashboard-data

  signal-cli:
    image: docker.io/bbernhard/signal-cli-rest-api:0.100-rootless
    container_name: bellaclaw-signal-cli
    profiles:
      - signal
    restart: unless-stopped
    environment:
      - MODE=json-rpc
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli

volumes:
  bellaclaw-data:
  dashboard-data:
  ollama-data:
  signal-cli-data:
