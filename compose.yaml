services:
  bellaclaw:
    image: bellaclaw:local
    build:
      context: .
      dockerfile: Containerfile
    container_name: bellaclaw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BELLACLAW_AI_CREDENTIALS_PATH=/app-data/pi-auth.json
      - SIGNAL_CLI_RPC_URL=http://signal-cli:8080
    volumes:
      - bellaclaw-data:/app-data

  log-viewer:
    image: bellaclaw:local
    build:
      context: .
      dockerfile: Containerfile
    container_name: bellaclaw-log-viewer
    restart: unless-stopped
    environment:
      - BELLACLAW_LOG_DB_PATH=/app-data/bellaclaw-logs.db
      - BELLACLAW_LOG_VIEWER_HOSTNAME=0.0.0.0
    command: ["bun", "run", "logs:ui"]
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - bellaclaw-data:/app-data:ro

  signal-cli:
    image: docker.io/bbernhard/signal-cli-rest-api:0.100-rootless
    container_name: bellaclaw-signal-cli
    profiles:
      - signal
    restart: unless-stopped
    environment:
      - MODE=json-rpc
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli

volumes:
  bellaclaw-data:
  signal-cli-data:
