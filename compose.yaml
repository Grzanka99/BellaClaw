services:
  bellaclaw:
    image: bellaclaw:local
    build:
      context: .
      dockerfile: Containerfile
    container_name: bellaclaw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BELLACLAW_AI_CREDENTIALS_PATH=/app/.secrets/pi-auth.json
      - BELLACLAW_LOG_DB_ROOT=/app-data
      - BELLACLAW_EMBEDDING_BASE_URL=http://ollama:11434
      - BELLACLAW_LOGS_MCP_URL=http://log-viewer:8989/mcp
      - SIGNAL_CLI_RPC_URL=http://signal-cli:8080
      - BELLACLAW_INTERNAL_API_HOSTNAME=0.0.0.0
      - BELLACLAW_APP_MEDIA_DIR=/app-data/app-media
      - BELLACLAW_FCM_CREDENTIALS_PATH=/app/.secrets/fcm-service-account.json
      - BELLACLAW_UPDATER_DIR=/app-data/updater
    depends_on:
      - ollama
      - log-viewer
    working_dir: /app/apps/assistant
    # NOTE: the updater migrates before it recreates this container; migrating here as well keeps a
    # manual `bun run server:update` on the host working
    command: ["sh", "-c", "bun scripts/migrate.ts && exec bun src/index.ts"]
    volumes:
      - bellaclaw-data:/app-data
      - ./.secrets:/app/.secrets
    ports:
      - "127.0.0.1:3080:3080"

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: bellaclaw-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  log-viewer:
    image: bellaclaw:local
    pull_policy: never
    container_name: bellaclaw-log-viewer
    restart: unless-stopped
    environment:
      - BELLACLAW_LOG_DB_PATH=${BELLACLAW_LOG_DB_PATH:-/app-data/bellaclaw-logs.db}
      - BELLACLAW_LOG_DB_ROOT=/app-data
      - BELLACLAW_LOG_VIEWER_HOSTNAME=0.0.0.0
      - LOG_CHATID_HMAC_KEY=${LOG_CHATID_HMAC_KEY:-}
    working_dir: /app/apps/log-viewer
    command: ["bun", "src/index.ts"]
    ports:
      - "0.0.0.0:8989:8989"
    volumes:
      - bellaclaw-data:/app-data:ro

  gateway:
    image: bellaclaw:local
    pull_policy: never
    container_name: bellaclaw-gateway
    restart: on-failure
    environment:
      - TURSO_CONNECTION_URL=${TURSO_CONNECTION_URL:-}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - BELLACLAW_GATEWAY_PUBLIC_URL=${BELLACLAW_GATEWAY_PUBLIC_URL:-}
      - BELLACLAW_GATEWAY_SECRET=${BELLACLAW_GATEWAY_SECRET:-}
      - BELLACLAW_INTERNAL_API_URL=http://bellaclaw:3081
      - BELLACLAW_GATEWAY_HOSTNAME=0.0.0.0
      - BELLACLAW_GATEWAY_DB_PATH=/dashboard-data/dashboard.db
    depends_on:
      - bellaclaw
    working_dir: /app/apps/gateway
    command: ["bun", "src/index.ts"]
    ports:
      - "127.0.0.1:8988:8988"
    volumes:
      - dashboard-data:/dashboard-data

  updater: &updater
    image: bellaclaw:local
    pull_policy: never
    container_name: bellaclaw-updater
    restart: unless-stopped
    # NOTE: the checkout and the socket keep their host paths, so Compose run in here resolves
    # ./.secrets, env_file and the project name as on the host, and the volumes it hands to Podman
    working_dir: ${PWD}
    security_opt:
      - label=disable
    environment:
      - CONTAINER_HOST=unix://${XDG_RUNTIME_DIR}/podman/podman.sock
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - BELLACLAW_UPDATER_DIR=/app-data/updater
      - BELLACLAW_AUTO_UPDATE=${BELLACLAW_AUTO_UPDATE:-}
    # NOTE: without --no-env-file Bun loads the checkout's .env at start, and Compose run in here
    # would prefer those values to the file an update script has since changed
    command: ["bun", "--no-env-file", "/app/apps/updater/src/index.ts"]
    volumes:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:${XDG_RUNTIME_DIR}/podman/podman.sock
      - ${PWD}:${PWD}
      - bellaclaw-data:/app-data

  # NOTE: the one-off container of an update, which the updater starts from the new image. With the
  # updater's restart policy it would run its update again each time it ends. Its profile keeps
  # `up` from starting it
  update-runner:
    <<: *updater
    container_name: bellaclaw-update-runner
    restart: "no"
    profiles:
      - update

  signal-cli:
    image: docker.io/bbernhard/signal-cli-rest-api:0.100-rootless
    container_name: bellaclaw-signal-cli
    profiles:
      - signal
    restart: unless-stopped
    environment:
      - MODE=json-rpc
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli

volumes:
  bellaclaw-data:
  dashboard-data:
  ollama-data:
  signal-cli-data:
