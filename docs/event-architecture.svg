<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 640" width="830" height="640" role="img" aria-label="BellaClaw services around the event bus">
<style>
text{fill:#e6e6e6;font:12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.h{font-size:13px;font-weight:700}
.t{font-size:18px;font-weight:700}
.m{fill:#9a9a9a;font-size:11px}
.k{fill:#c8c8c8;font-size:11px;font-weight:600}
.box{fill:#1b1b1b;stroke:#5a5a5a;stroke-width:1}
.bus{fill:#2a2a2a;stroke:#9a9a9a;stroke-width:1.5}
.ln{stroke:#8a8a8a;stroke-width:1.4;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a8a8a"/></marker></defs>
<rect x="0" y="0" width="830" height="640" fill="#0f0f0f"/>
<text class="t" x="20" y="32">BellaClaw: services around the event bus</text>
<text class="m" x="20" y="50">left arrow of each pair: publishes to the bus · right arrow: delivered from the bus</text>
<rect class="box" x="20" y="70" width="185" height="130"/>
<text class="h" x="30" y="90">Discord · Signal</text>
<text class="k" x="30" y="108">pub</text>
<text class="m" x="58" y="108">message.received</text>
<text class="k" x="30" y="126">sub</text>
<text class="m" x="58" y="126">none (outbound drives them)</text>
<path class="ln" d="M106.5,200V248"/>
<rect class="box" x="222" y="70" width="185" height="130"/>
<text class="h" x="232" y="90">authorization</text>
<text class="k" x="232" y="108">pub</text>
<text class="m" x="260" y="108">message.authorized</text>
<text class="m" x="260" y="123">authorization.changed</text>
<text class="m" x="260" y="138">reply.ready (activation)</text>
<text class="k" x="232" y="156">sub</text>
<text class="m" x="260" y="156">message.received</text>
<path class="ln" d="M308.5,200V248"/>
<path class="ln" d="M320.5,250V202"/>
<rect class="box" x="424" y="70" width="185" height="130"/>
<text class="h" x="434" y="90">commands</text>
<text class="k" x="434" y="108">pub</text>
<text class="m" x="462" y="108">turn.requested</text>
<text class="m" x="462" y="123">reply.ready</text>
<text class="m" x="462" y="138">slash *.requested</text>
<text class="k" x="434" y="156">sub</text>
<text class="m" x="462" y="156">message.authorized</text>
<path class="ln" d="M510.5,200V248"/>
<path class="ln" d="M522.5,250V202"/>
<rect class="box" x="626" y="70" width="185" height="130"/>
<text class="h" x="636" y="90">conversation</text>
<text class="k" x="636" y="108">pub</text>
<text class="m" x="664" y="108">turn.started · reply.ready</text>
<text class="m" x="664" y="123">turn.completed</text>
<text class="m" x="664" y="138">tool *.requested</text>
<text class="k" x="636" y="156">sub</text>
<text class="m" x="664" y="156">turn.requested</text>
<text class="m" x="664" y="171">message.sent</text>
<path class="ln" d="M712.5,200V248"/>
<path class="ln" d="M724.5,250V202"/>
<rect class="bus" x="20" y="250" width="791" height="70"/>
<text class="h" x="36" y="272">EventBus · apps/assistant/src/services/events</text>
<text class="m" x="36" y="290">SQLite tables events (outbox + history) and event_deliveries (one row per durable consumer)</text>
<text class="m" x="36" y="306">a lane per consumer × key, in log order · retries · dead letters · replay on boot · request()/waitFor() for commands</text>
<path class="ln" d="M106.5,370V322"/>
<path class="ln" d="M118.5,320V368"/>
<rect class="box" x="20" y="370" width="185" height="120"/>
<text class="h" x="30" y="390">cron</text>
<text class="k" x="30" y="408">pub</text>
<text class="m" x="58" y="408">cron.fired</text>
<text class="m" x="58" y="423">job outcomes</text>
<text class="k" x="30" y="441">sub</text>
<text class="m" x="58" y="441">cron.job.*.requested</text>
<text class="m" x="58" y="456">automation.deleted</text>
<path class="ln" d="M308.5,370V322"/>
<path class="ln" d="M320.5,320V368"/>
<rect class="box" x="222" y="370" width="185" height="120"/>
<text class="h" x="232" y="390">scheduling</text>
<text class="k" x="232" y="408">pub</text>
<text class="m" x="260" y="408">delivery.ready</text>
<text class="m" x="260" y="423">cron.task.started</text>
<text class="m" x="260" y="438">automation.run.requested</text>
<text class="k" x="232" y="456">sub</text>
<text class="m" x="260" y="456">cron.fired</text>
<path class="ln" d="M510.5,370V322"/>
<path class="ln" d="M522.5,320V368"/>
<rect class="box" x="424" y="370" width="185" height="120"/>
<text class="h" x="434" y="390">memory</text>
<text class="k" x="434" y="408">pub</text>
<text class="m" x="462" y="408">memory outcomes</text>
<text class="k" x="434" y="426">sub</text>
<text class="m" x="462" y="426">turn.completed</text>
<text class="m" x="462" y="441">memory.*.requested</text>
<path class="ln" d="M712.5,370V322"/>
<path class="ln" d="M724.5,320V368"/>
<rect class="box" x="626" y="370" width="185" height="120"/>
<text class="h" x="636" y="390">outbound</text>
<text class="k" x="636" y="408">pub</text>
<text class="m" x="664" y="408">message.sent</text>
<text class="k" x="636" y="426">sub</text>
<text class="m" x="664" y="426">reply.ready · notice.ready</text>
<text class="m" x="664" y="441">delivery.ready</text>
<path class="ln" d="M207,530V322"/><path class="ln" d="M217,320V528"/>
<rect class="box" x="20" y="530" width="584" height="90"/>
<text class="h" x="30" y="550">command owners: automations · settings · calendar · mcp-auth · ai-auth</text>
<text class="k" x="30" y="568">pub</text>
<text class="m" x="58" y="568">outcomes · command.rejected · settings.changed · mcp/ai auth events</text>
<text class="k" x="30" y="586">sub</text>
<text class="m" x="58" y="586">their *.requested commands</text>
<path class="ln" d="M611,530V322"/><path class="ln" d="M621,320V528"/>
<rect class="box" x="626" y="530" width="185" height="90"/>
<text class="h" x="636" y="550">notices</text>
<text class="k" x="636" y="568">pub</text>
<text class="m" x="664" y="568">notice.ready</text>
<text class="k" x="636" y="586">sub</text>
<text class="m" x="664" y="586">auth events</text>
<text class="m" x="664" y="601">event.dead_lettered</text>
</svg>
