<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 760 690" width="760" height="690" role="img" aria-label="BellaClaw event flow">
<style>
text{fill:#f2edf3;font:13px system-ui,-apple-system,"Segoe UI",sans-serif}
.sm{font-size:11px;fill:#b9afba}
.b{fill:#29252a;stroke:#454047;stroke-width:1.5}
.own{fill:#372a3c;stroke:#d3a5e4;stroke-width:1.5}
.ev{stroke:#f0a070;stroke-width:1.8;fill:none;marker-end:url(#aE)}
.cmd{stroke:#7cb8f0;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#aC)}
.lv{stroke:#7fcf96;stroke-width:1.6;fill:none;stroke-dasharray:2 3;marker-end:url(#aL)}
.evt{fill:#f0a070;font-size:11.5px;font-weight:600}
.cmt{fill:#7cb8f0;font-size:11.5px;font-weight:600}
.title{font-size:16px;font-weight:700}
</style>
<rect x="0" y="-60" width="760" height="690" fill="#0d0b0e"/>
<text class="title" x="30" y="-30">BellaClaw event flow</text>
<line x1="30" y1="-12" x2="56" y2="-12" stroke="#f0a070" stroke-width="2"/><text class="sm" x="62" y="-8">fact</text><line x1="100" y1="-12" x2="126" y2="-12" stroke="#7cb8f0" stroke-width="2" stroke-dasharray="6 4"/><text class="sm" x="132" y="-8">command → outcome</text><line x1="250" y1="-12" x2="276" y2="-12" stroke="#7fcf96" stroke-width="2" stroke-dasharray="2 3"/><text class="sm" x="282" y="-8">live subscription</text>
    <defs>
      <marker id="aE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#f0a070"/></marker>
      <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7cb8f0"/></marker>
      <marker id="aL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7fcf96"/></marker>
    </defs>

    <!-- chat path edges -->
    <path class="ev" d="M155,64V108"/><text class="evt" x="165" y="91">message.received</text>
    <path class="ev" d="M155,154V198"/><text class="evt" x="165" y="181">message.authorized</text>
    <path class="ev" d="M155,244V288"/><text class="evt" x="165" y="271">turn.requested</text>
    <path class="ev" d="M155,370V468"/><text class="evt" x="40" y="420">turn.completed</text>
    <path class="ev" d="M260,370L330,468"/><text class="evt" x="300" y="408">reply.ready</text>
    <path class="lv" d="M30,121H12V320H28"/><text class="sm" x="4" y="104">cache</text>

    <!-- schedule path edges -->
    <path class="ev" d="M605,64V108"/><text class="evt" x="615" y="91">cron.fired</text>
    <path class="ev" d="M500,140H430V468"/><text class="evt" x="424" y="200" text-anchor="end">delivery.ready</text>
    <path class="cmd" d="M605,154V258"/><text class="cmt" x="615" y="210">automation.run</text>
    <path class="cmd" d="M282,315H478"/><text class="cmt" x="320" y="306">tool commands</text>
    <path class="ev" d="M600,500H507"/><text class="evt" x="520" y="492">notice.ready</text>

    <!-- boxes -->
    <rect class="b" x="30" y="20" width="250" height="44" rx="10"/><text x="155" y="40" text-anchor="middle">Discord · Signal</text><text class="sm" x="155" y="56" text-anchor="middle">dedupe key per inbound message</text>
    <rect class="own" x="30" y="110" width="250" height="44" rx="10"/><text x="155" y="130" text-anchor="middle">authorization</text><text class="sm" x="155" y="146" text-anchor="middle">activation · lockout · authorization.changed</text>
    <rect class="own" x="30" y="200" width="250" height="44" rx="10"/><text x="155" y="220" text-anchor="middle">commands</text><text class="sm" x="155" y="236" text-anchor="middle">!slash → reply.ready · text → turn</text>
    <rect class="own" x="30" y="290" width="250" height="80" rx="10"/><text x="155" y="312" text-anchor="middle">conversation (chat lane)</text><text class="sm" x="155" y="330" text-anchor="middle">turn.started checkpoint</text><text class="sm" x="155" y="346" text-anchor="middle">model + tools · save turn + ack</text><text class="sm" x="155" y="362" text-anchor="middle">post-turn compaction</text>
    <rect class="own" x="30" y="470" width="200" height="60" rx="10"/><text x="130" y="492" text-anchor="middle">memory (chat lane)</text><text class="sm" x="130" y="510" text-anchor="middle">fact drain · remember</text><text class="sm" x="130" y="524" text-anchor="middle">forget · refresh</text>

    <rect class="own" x="500" y="20" width="230" height="44" rx="10"/><text x="615" y="40" text-anchor="middle">cron</text><text class="sm" x="615" y="56" text-anchor="middle">job update + fire in one tx</text>
    <rect class="own" x="500" y="110" width="230" height="44" rx="10"/><text x="615" y="130" text-anchor="middle">scheduling</text><text class="sm" x="615" y="146" text-anchor="middle">cron.task.started checkpoint</text>
    <rect class="own" x="480" y="260" width="250" height="110" rx="10"/><text x="605" y="282" text-anchor="middle">command owners</text><text class="sm" x="605" y="302" text-anchor="middle">cron · automations · memory</text><text class="sm" x="605" y="318" text-anchor="middle">settings · calendar</text><text class="sm" x="605" y="334" text-anchor="middle">mcp-auth · ai-auth</text><text class="sm" x="605" y="356" text-anchor="middle">→ outcome or command.rejected</text>

    <rect class="own" x="260" y="470" width="245" height="60" rx="10"/><text x="382" y="492" text-anchor="middle">outbound</text><text class="sm" x="382" y="510" text-anchor="middle">send, then message.sent + ack</text><text class="sm" x="382" y="524" text-anchor="middle">retries while transport is down</text>
    <rect class="own" x="600" y="470" width="130" height="60" rx="10"/><text x="665" y="492" text-anchor="middle">notices</text><text class="sm" x="665" y="510" text-anchor="middle">auth events</text><text class="sm" x="665" y="524" text-anchor="middle">dead letters</text>

    <path class="ev" d="M300,530V578H245V374"/><text class="evt" x="310" y="582">message.sent → transcript append (chat lane)</text>
  </svg>
